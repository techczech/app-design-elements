<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Settings window — A with C's inspector and B's recent changes (locked candidate)</title>
<meta name="viewport" content="width=1200">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#e4e5e9;color:#1d1d1f;font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:root{--mono:ui-monospace,"SF Mono",Menlo,monospace;--accent:#0a64d8;--ink2:#6b6f78;--line:#e6e7eb}
.page{width:1180px;margin:0 auto;padding:20px 0 30px}
/* identity + frame bar */
.ident{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.badge{background:#1f9d4d;color:#fff;font-size:20px;font-weight:700;padding:14px 18px;border-radius:6px;white-space:nowrap}
.ident .nm{font-size:22px;font-weight:700}
.ident .sub{color:#555a63;font-size:13px;margin-top:3px}
.fbar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.fbar button{border:1px solid #c3c6cd;background:#f4f5f7;padding:5px 9px;border-radius:5px;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:12px}
.fbar button b{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;background:#d3d6dc;border-radius:3px;font-size:11px}
.fbar button.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.fbar button.on b{background:#555;color:#fff}
.stage{position:relative;width:1180px;height:790px;background:#a7adb8;border-radius:6px;overflow:hidden}
/* menu bar */
.menubar{position:absolute;left:0;right:0;top:0;height:24px;background:#e9eaee;border-bottom:1px solid #c5c8cf;display:flex;align-items:center;padding:0 12px;gap:18px;font-size:13px;z-index:30}
.menubar .ap{font-weight:700}
.menubar .m{padding:2px 8px;border-radius:4px}
.menubar .m.open{background:#0a64d8;color:#fff}
.menubar .sp{flex:1}
.appmenu{position:absolute;left:40px;top:26px;width:270px;background:#f2f2f5;border:1px solid #b9bcc4;border-radius:8px;padding:5px;z-index:31;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.appmenu div{padding:4px 10px;border-radius:4px;display:flex;justify-content:space-between}
.appmenu div.hl{background:#0a64d8;color:#fff}
.appmenu div.dim{color:#8a8d95}
.appmenu hr{border:0;border-top:1px solid #d3d5db;margin:4px 6px}
/* window */
.win{position:absolute;left:90px;top:50px;width:1000px;height:690px;background:#ececf0;border-radius:10px;border:1px solid #8b909a;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}
.titlebar{height:40px;flex:none;background:#f6f6f8;border-bottom:1px solid #cfd1d8;display:flex;align-items:center;padding:0 14px;position:relative}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.titlebar .tt{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:13px;pointer-events:none}
.body{flex:1;display:flex;min-height:0}
/* sidebar */
.side{width:210px;flex:none;background:#e3e3e8;border-right:1px solid #cbcdd4;display:flex;flex-direction:column}
.search{margin:10px 10px 6px;position:relative}
.search input{width:100%;height:28px;border:1px solid #c2c4cc;border-radius:6px;background:#fff;padding:0 26px 0 27px;font:inherit;outline:none}
.search input.f{border-color:#0a64d8;box-shadow:0 0 0 3px rgba(10,100,216,.25)}
.search .si{position:absolute;left:8px;top:7px;width:14px;height:14px;color:#6b6f78}
.search .cl{position:absolute;right:6px;top:6px;width:16px;height:16px;color:#6b6f78;cursor:pointer;display:none}
.search.has .cl{display:block}
.navwrap{flex:1;overflow:auto;padding:0 8px}
.grp{font-size:11px;font-weight:600;color:#6b6f78;text-transform:uppercase;letter-spacing:.04em;padding:9px 8px 4px}
.nav{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;cursor:pointer;margin-bottom:1px}
.nav svg{width:16px;height:16px;flex:none;color:#4a4e57}
.nav:hover{background:#d6d7de}
.nav.sel{background:#0a64d8;color:#fff}
.nav.sel svg{color:#fff}
.nav .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:11px;min-width:18px;height:16px;line-height:16px;text-align:center;border-radius:8px;background:#c9ccd4;color:#2a2d33;padding:0 5px}
.nav.sel .cnt{background:rgba(255,255,255,.3);color:#fff}
.nav .cnt.new{background:#7a3fd1;color:#fff}
.nav .cnt.imp{background:#0f7b74;color:#fff}
.nav.muted{color:#9a9da6}.nav.muted svg{color:#a6a9b1}
.sidefoot{flex:none;background:#d6d7de;border-top:1px solid #c3c5cc;padding:6px 8px}
/* main pane */
.pane{flex:1;display:flex;flex-direction:column;min-width:0;background:#ececf0}
.phead{height:46px;flex:none;background:#f8f8fa;border-bottom:1px solid #cfd1d8;display:flex;align-items:center;padding:0 14px;gap:10px}
.phead>svg{width:18px;height:18px;color:#4a4e57}
.phead h1{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .meta{color:#6b6f78;font-size:12px;white-space:nowrap}
.pscroll{flex:1;overflow:auto;padding:14px}
.card{background:#fff;border:1px solid #d0d2d9;border-radius:8px;margin-bottom:14px;overflow:hidden}
.card>.ch{background:#dcdde3;padding:6px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#3c3f46;display:flex;align-items:center;gap:8px;border-bottom:1px solid #cbcdd4;min-height:28px}
.card>.ch .sp{flex:1}
.card>.ch .lk{text-transform:none;letter-spacing:0;font-weight:500;color:#0a64d8;display:flex;gap:4px;align-items:center;cursor:pointer}
.card>.ch svg{width:13px;height:13px}
.card>.ch.imp{background:#d3ebe8;color:#0b4f4a;border-bottom-color:#b5d9d4}
.card>.ch.imp .fn{text-transform:none;letter-spacing:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;min-height:42px;border-bottom:1px solid #e6e7eb;cursor:default}
.row:last-child{border-bottom:0}
.row .lab{flex:1;min-width:0}
.row .t{display:flex;align-items:center;gap:7px;font-weight:500;flex-wrap:wrap}
.row .h{color:#6b6f78;font-size:12px;margin-top:1px}
.row .ctl{display:flex;align-items:center;gap:6px;flex:none}
.row.changed .t::before{content:"";width:7px;height:7px;border-radius:50%;background:#0a64d8;flex:none;margin-left:-2px}
.row.agent{background:#f6f0fd;box-shadow:inset 3px 0 0 #7a3fd1}
.row.agent .t::before{background:#7a3fd1}
.row.err .h.e{color:#c4001a;display:flex;gap:4px;align-items:center;font-weight:500}
.row.err .h.e svg{width:13px;height:13px;flex:none}
.row.dis .t,.row.dis .ctl{opacity:.45}
.row.dis .h.d{color:#6b6f78;display:flex;gap:4px;align-items:center}
.row.dis .h.d svg{width:12px;height:12px}
.row.sel{box-shadow:inset 0 0 0 2px #0a64d8;background:#f1f7ff}
.row.agent.sel{box-shadow:inset 3px 0 0 #7a3fd1,inset 0 0 0 2px #7a3fd1;background:#f3ebfd}
.alink{color:#5b27a6;display:flex;gap:4px;align-items:center;font-size:12px;margin-top:2px}
.alink a{text-decoration:underline;cursor:pointer}
.alink svg{width:12px;height:12px}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag svg{width:11px;height:11px}
.tag.chg{background:#dce9fb;color:#0a4fae}
.tag.ag{background:#ebe0fa;color:#5b27a6}
.tag.you{background:#dce9fb;color:#0a4fae}
.tag.app{background:#e4e5e9;color:#3c3f46}
.tag.imp{background:#d3ebe8;color:#0b4f4a}
.tag.rs{background:#fdecc8;color:#7a5200}
.tag.none{background:#e8eaee;color:#4a4e57}
.btn{height:24px;border:1px solid #c3c5cc;background:#fff;border-radius:5px;padding:0 9px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.btn svg{width:13px;height:13px}
.btn:hover{background:#f3f4f6}
.btn.pri{background:#0a64d8;border-color:#0a54b8;color:#fff}
.btn.dng{color:#c4001a}
.btn.dngp{background:#d70015;border-color:#b00011;color:#fff}
.btn.lg{height:28px;padding:0 12px}
.btn.dis{opacity:.45;cursor:default}
.rst{height:22px;border:0;background:transparent;color:#0a64d8;display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:0 4px;border-radius:4px;white-space:nowrap}
.rst svg{width:12px;height:12px}
.rst:hover,.rst.hv{background:#e4eefc}
.tg{width:36px;height:20px;border-radius:10px;background:#c5c7ce;position:relative;display:inline-block;cursor:pointer;flex:none}
.tg i{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:left .12s}
.tg.on{background:#1f9d4d}.tg.on i{left:18px}
.sel2{height:24px;min-width:130px;border:1px solid #c3c5cc;border-radius:5px;background:#fff;padding:0 6px 0 9px;display:inline-flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.06);white-space:nowrap}
.sel2 svg{width:13px;height:13px;color:#6b6f78}
.txt{height:24px;width:170px;border:1px solid #c3c5cc;border-radius:5px;padding:0 8px;font:inherit;background:#fff}
.num{height:24px;width:100px;border:1px solid #c3c5cc;border-radius:5px;background:#fff;display:inline-flex;align-items:center;padding-left:8px}
.num input{border:0;outline:0;width:38px;font:inherit;background:transparent;text-align:right}
.num .u{color:#6b6f78;margin-left:3px;flex:1}
.num .st{width:22px;height:100%;border-left:1px solid #dcdee3;display:flex;align-items:center;justify-content:center;color:#6b6f78}
.num .st svg{width:13px;height:13px}
.num.bad{border-color:#d70015;box-shadow:0 0 0 3px rgba(215,0,21,.18)}
.path{display:inline-flex;align-items:center;gap:6px;height:24px;max-width:170px;border:1px solid #c3c5cc;border-radius:5px;background:#f6f6f8;padding:0 8px;color:#2a2d33;overflow:hidden;white-space:nowrap}
.path svg{width:13px;height:13px;color:#6b6f78;flex:none}
.path span{overflow:hidden;text-overflow:ellipsis}
.kbd{display:inline-flex;align-items:center;height:24px;min-width:58px;justify-content:center;padding:0 9px;border:1px solid #c3c5cc;border-bottom-width:2px;border-radius:5px;background:#fafafb;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.kbd.rec{border-color:#0a64d8;box-shadow:0 0 0 3px rgba(10,100,216,.25);color:#0a64d8;letter-spacing:0;font-weight:500;min-width:140px}
.kbd.conf{border-color:#d70015;color:#c4001a}
.secv{display:inline-flex;align-items:center;gap:6px;height:24px;color:#6b6f78;white-space:nowrap}
.secv b{color:#1d1d1f;letter-spacing:.1em;font-weight:400}
.secv svg{width:13px;height:13px}
.seg{display:inline-flex;border:1px solid #c3c5cc;border-radius:5px;overflow:hidden;background:#fff}
.seg span{padding:3px 11px;border-left:1px solid #c3c5cc;white-space:nowrap}
.seg span:first-child{border-left:0}
.seg span.on{background:#0a64d8;color:#fff}
mark{background:#ffe27a;color:inherit;border-radius:2px;padding:0 1px}
/* inspector */
.insp{width:240px;flex:none;background:#f4f5f8;border-left:1px solid #b9bdc7;display:flex;flex-direction:column;min-height:0}
.insp>h4{height:30px;flex:none;background:#d4d7de;border-bottom:1px solid #b5bac5;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#2b2e35}
.insp>h4 svg{width:13px;height:13px}
.ib{padding:10px 12px 12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.ib .nm{font-size:15px;font-weight:650;line-height:1.2}
.ib .where{font-size:11.5px;color:var(--ink2);margin-top:3px;display:flex;align-items:center;gap:4px}
.ib .where svg{width:12px;height:12px}
.ib p{font-size:12px;line-height:1.4;color:#2c2f36}
.kv{background:#fff;border:1px solid #c3c7d1;border-radius:5px}
.kv div{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;font-size:12px;gap:8px;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}.kv span:first-child{color:var(--ink2)}
.kv b{font-weight:600;text-align:right}
.subh{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--ink2);margin-bottom:4px}
.hist{background:#fff;border:1px solid #c3c7d1;border-radius:5px}
.hist>div{padding:5px 8px;font-size:11.5px;border-bottom:1px solid var(--line);line-height:1.35}
.hist>div:last-child{border-bottom:0}
.hist .l2{display:flex;gap:6px;align-items:center;color:var(--ink2);margin-top:2px}
.hist .o{color:#6b6f78;text-decoration:line-through}
.arrow{color:#8a8d95}
.code{background:#23262d;color:#e8eaf0;border-radius:5px;font-family:var(--mono);font-size:11px;padding:6px 8px;display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.code span{flex:1;overflow-wrap:anywhere}.code svg{color:#9aa0ad;margin-top:2px;width:12px;height:12px;flex:none}
.code+.code{margin-top:4px}
.perm{font-size:11.5px;color:var(--ink2);display:flex;gap:5px;align-items:center;margin-top:5px}
.perm svg{width:12px;height:12px;flex:none}
.iempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink2);text-align:center;padding:20px}
.iempty svg{width:28px;height:28px;color:#9a9da6}
.iempty b{font-size:13px;color:#1d1d1f}
/* recent changes (in the inspector when nothing is selected) */
.rc{flex:1;overflow:auto}
.rci{padding:8px 12px;border-bottom:1px solid #dcdee4;background:#fff}
.rci{display:grid;grid-template-columns:1fr auto;column-gap:6px}
.rci .s{font-weight:600}
.rci .rst{grid-column:2;grid-row:1;align-self:start;margin-top:-2px}
.rci .v{grid-column:1/span 2}
.rci .l2{grid-column:1/span 2;flex-wrap:wrap}
.rci .v{font-size:12px;margin-top:1px}
.rci .v .o{color:#6b6f78;text-decoration:line-through}
.rci .l2{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11.5px;color:var(--ink2)}
.rci .l2 .sp{flex:1}
.rci.fresh{background:#f6f0fd;box-shadow:inset 3px 0 0 #7a3fd1}
.rcfoot{flex:none;padding:8px 10px;border-top:1px solid #c3c5cc;background:#e3e4e9}
.rcfoot .btn{width:100%;justify-content:center}
/* changes list */
.tool{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tool .search2{position:relative;flex:1;min-width:0}
.tool .search2 input{width:100%;height:26px;border:1px solid #c2c4cc;border-radius:6px;padding:0 8px 0 26px;font:inherit;background:#fff;outline:none}
.tool .search2 svg{position:absolute;left:8px;top:6px;width:14px;height:14px;color:#6b6f78}
.segf{display:inline-flex;border:1px solid #c3c5cc;border-radius:6px;overflow:hidden;background:#fff;flex:none}
.segf span{padding:4px 8px;border-left:1px solid #c3c5cc;display:flex;gap:4px;align-items:center;white-space:nowrap;font-size:12px}
.segf span:first-child{border-left:0}
.segf span.on{background:#0a64d8;color:#fff}
.segf span em{font-style:normal;font-size:11px;opacity:.7}
.cr{display:grid;grid-template-columns:1fr 128px 62px;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid #e6e7eb}
.cr:last-child{border-bottom:0}
.cr .s b{font-weight:600}
.cr .s small{color:#6b6f78;font-size:11px;margin-left:4px}
.cr .c{display:flex;align-items:center;gap:5px;font-size:12px;margin-top:2px;flex-wrap:wrap}
.cr .c .o{color:#6b6f78;text-decoration:line-through}
.cr .c svg{width:12px;height:12px;color:#8a8d95}
.cr .c .nw{font-weight:600}
.cr .who{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.cr .who small{color:#6b6f78;font-size:11.5px}
.cr.isr{background:#fffaf0}
.cr.sel{box-shadow:inset 0 0 0 2px #0a64d8;background:#f1f7ff}
.cr.fresh{background:#f6f0fd}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 20px;color:#4a4e57}
.empty>svg{width:34px;height:34px;color:#8a8d95;margin-bottom:10px}
.empty h2{font-size:15px;font-weight:600;color:#1d1d1f;margin-bottom:4px}
.empty p{color:#6b6f78;margin-bottom:12px}
.empty .acts{display:flex;gap:8px}
/* shortcuts */
.cmd{display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:38px;border-bottom:1px solid #e6e7eb}
.cmd:last-child{border-bottom:0}
.cmd .lab{flex:1;font-weight:500}
.cmd .lab small{display:block;color:#6b6f78;font-size:12px;font-weight:400}
.cmd.cap{background:#f1f7ff;box-shadow:inset 3px 0 0 #0a64d8,inset 0 0 0 2px #0a64d8}
.cmd.ch2{background:#fff5f5;box-shadow:inset 3px 0 0 #d70015;flex-wrap:wrap}
.conf-box{flex-basis:100%;display:flex;align-items:center;gap:6px;color:#c4001a;padding:2px 0 4px;font-weight:500}
.conf-box svg{width:14px;height:14px}
.conf-box .sp{flex:1}
/* accounts */
.svc{display:flex;gap:12px;padding:12px;align-items:flex-start;border-bottom:1px solid #e6e7eb}
.svc:last-child{border-bottom:0}
.svc.sel{box-shadow:inset 0 0 0 2px #0a64d8;background:#f8fbff}
.svc .ic{width:32px;height:32px;border-radius:8px;background:#e4e5e9;display:flex;align-items:center;justify-content:center;flex:none}
.svc .ic svg{width:17px;height:17px;color:#4a4e57}
.svc .mid{flex:1;min-width:0}
.svc .nm{font-weight:600}
.svc .stl{display:flex;align-items:center;gap:5px;margin-top:2px}
.svc .stl svg{width:14px;height:14px;flex:none}
.stl.ok{color:#177a3a}.stl.no{color:#6b6f78}.stl.bad{color:#c4001a}
.svc .acts{display:flex;gap:6px;flex:none}
.keyform{margin-top:10px;background:#f4f4f7;border:1px solid #d0d2d9;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.keyform .line{display:flex;gap:6px;align-items:center}
.keyform .txt{flex:1;width:auto;letter-spacing:.14em}
.keyform .sv{color:#6b6f78;display:flex;gap:5px;align-items:center;font-size:12px}
.keyform .sv svg{width:12px;height:12px}
/* about */
.abouthead{display:flex;gap:14px;align-items:center;padding:14px 12px}
.abouthead .ap{width:52px;height:52px;border-radius:12px;background:#1d1d1f;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.abouthead .ap svg{width:26px;height:26px}
.abouthead b{font-size:16px}
/* sheets */
.scrim{position:absolute;inset:40px 0 0 0;background:rgba(0,0,0,.28);display:flex;justify-content:center;align-items:flex-start;z-index:20}
.sheet{width:390px;background:#f6f6f8;border:1px solid #b9bcc4;border-top:0;border-radius:0 0 12px 12px;padding:18px 20px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.sheet h3{font-size:14px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.sheet h3 svg{width:18px;height:18px;color:#d70015;flex:none}
.sheet p{color:#4a4e57;margin-bottom:12px}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.sheet .acts .sp{flex:1}
/* save panel */
.save{width:500px;padding:16px 20px 16px}
.save .fl{display:grid;grid-template-columns:70px 1fr;gap:8px 10px;align-items:center;margin-bottom:12px}
.save .fl label{text-align:right;color:#3c3f46}

const $=(s,r=document)=>r.querySelector(s);
const ic=(n,c)=>`<i data-lucide="${n}"${c?` class="${c}"`:''}></i>`;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function hl(text,q){
  const t=esc(text); if(!q) return t;
  const i=text.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return t;
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}

function whoTag(who,wn){

}
function control(r){
  switch(r.t){
    case 'toggle': return `<span class="tg ${r.v?'on':''}" onclick="event.stopPropagation();this.classList.toggle('on')"><i></i></span>`;
    case 'choice': return `<span class="sel2"><span>${esc(r.v)}</span>${ic('chevrons-up-down')}</span>`;
    case 'seg': return `<span class="seg">${r.opts.map(o=>`<span class="${o===r.v?'on':''}">${o}</span>`).join('')}</span>`;
    case 'text': return `<input class="txt" value="${esc(r.v)}">`;
    case 'num': return `<span class="num ${r.err?'bad':''}"><input value="${esc(r.v)}"><span class="u">${esc(r.u||'')}</span><span class="st">${ic('chevrons-up-down')}</span></span>`;
    case 'path': return `<span class="path">${ic('folder')}<span>${esc(r.v)}</span></span><button class="btn">Choose…</button>`;
    case 'chord': return `<span class="kbd">${r.v}</span>`;
    case 'secret': return `<span class="secv"><b>••••••••</b>${ic('lock')}Saved in Keychain</span><button class="btn">Replace…</button>`;
    case 'button': return `<span class="secv">${esc(r.v)}</span><button class="btn">${esc(r.btn)}</button>`;
  }
}

function searchRows(q){

function render(){
  const f=FRAMES[S.frame]; S.st=Object.assign({},f.st); const st=S.st, a=app();
  document.querySelectorAll('#fbar button').forEach((b,i)=>b.classList.toggle('on',i===S.frame));
  const stage=$('#stage');
  if(st.menu){ stage.innerHTML=menubar(a.name,true)+appMenu(a.name)+mainApp(a.name); lucide.createIcons(); return; }
  stage.innerHTML=menubar(a.name,false)+`<div class="win">
    <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><div class="tt">Settings</div></div>
    <div class="body">
      <div class="side">
        <div class="search ${st.q?'has':''}">${ic('search','si')}<input id="q" placeholder="Search settings" value="${esc(st.q||'')}" class="${st.q||st.focus?'f':''}">${ic('circle-x','cl')}</div>
        <div class="navwrap" id="nav"></div>
        <div class="sidefoot">
          <div class="nav" data-sec="changes">${ic('clipboard-list')}<span class="n">Changes</span><span id="cb"></span></div>
          <div class="nav" data-sec="about">${ic('info')}<span class="n">About</span></div>
        </div>
      </div>
      <div class="pane" id="pane"></div>
      <div class="insp" id="insp"></div>
    </div>${st.dialog?dialog(st.dialog):''}</div>`;
  refresh();
}
function refresh(){
  const st=S.st;
  $('#nav').innerHTML=navHtml(); $('#pane').innerHTML=pane(); $('#insp').innerHTML=inspector();
  $('#cb').outerHTML=`<span id="cb">${changesBadge()}</span>`;
  $('.search').classList.toggle('has',!!st.q);
  document.querySelectorAll('.sidefoot .nav').forEach(n=>n.classList.toggle('sel',!st.q&&st.sec===n.dataset.sec));
  wire(); lucide.createIcons();
  const ps=$('#ps'); if(ps&&st.scrollEnd) ps.scrollTop=ps.scrollHeight;
}
function wire(){
  document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{Object.assign(S.st,{q:'',sec:n.dataset.sec,sel:null,dialog:null,live:false,selChange:0});refresh();});
  document.querySelectorAll('.row[data-k]').forEach(r=>r.onclick=()=>{S.st.sel=(S.st.sel===r.dataset.k)?null:r.dataset.k;refresh();});
  const q=$('#q'); if(!q) return;
  q.oninput=()=>{S.st.q=q.value;S.st.sel=null;refresh();const n=$('#q');n.focus();n.setSelectionRange(n.value.length,n.value.length);};
  const cl=$('.search .cl'); if(cl) cl.onclick=()=>{S.st.q='';S.st.sec=S.st.sec||'general';refresh();};
}
/* boot */
FRAMES.forEach((f,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${f.k.toUpperCase()}</b>${f.n}`;b.onclick=()=>{S.frame=i;render()};$('#fbar').appendChild(b);});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowRight'){S.frame=(S.frame+1)%FRAMES.length;render();return;}
  if(e.key==='ArrowLeft'){S.frame=(S.frame+FRAMES.length-1)%FRAMES.length;render();return;}
  const i=FRAMES.findIndex(f=>f.k===e.key.toLowerCase()); if(i>=0){S.frame=i;render();}
});
const h=parseInt((location.hash||'').slice(1));
S.frame=(h>=1&&h<=FRAMES.length)?h-1:0;
render();
window.__frames=FRAMES.length;
window.__go=(i)=>{S.frame=i;render()};
</script>
</body>
</html>
